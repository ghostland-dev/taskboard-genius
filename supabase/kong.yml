
_format_version: "2.1"
_transform: true

services:
  - name: auth-v1
    url: http://supabase-auth:9999/verify
    routes:
      - name: auth-v1-route
        strip_path: true
        paths:
          - /auth/v1/verify
    plugins:
      - name: cors
  - name: auth-v1-admin
    url: http://supabase-auth:9999/admin
    routes:
      - name: auth-v1-admin-route
        strip_path: true
        paths:
          - /auth/v1/admin
    plugins:
      - name: cors
  - name: auth-v1-callback
    url: http://supabase-auth:9999/callback
    routes:
      - name: auth-v1-callback-route
        strip_path: false
        paths:
          - /auth/v1/callback
    plugins:
      - name: cors
  - name: rest
    url: http://supabase-api:3000
    routes:
      - name: rest-route
        strip_path: true
        paths:
          - /rest/v1
    plugins:
      - name: cors
  - name: realtime
    url: http://supabase-realtime:4000/socket
    routes:
      - name: realtime-route
        strip_path: true
        paths:
          - /realtime/v1
    plugins:
      - name: cors
  - name: storage
    url: http://storage:5000
    routes:
      - name: storage-route
        strip_path: true
        paths:
          - /storage/v1
    plugins:
      - name: cors
